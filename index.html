<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate-key="app_title">ROI Marketing App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Design System Colors (available as CSS variables) */
        :root {
            --abyss-blue: #1A202C;
            --golden-hive: #FFC107;
            --light-nectar: #F7FAFC;
            --deep-slate: #2D3748;
            --white-honey: #FFFFFF;
            --bright-pollen: #FFA000; /* Accent color */
            --honeycomb-gray: #A0AEC0; /* For secondary text or borders */
            --pollen-dust: #E2E8F0; /* For lighter borders or backgrounds */
        }

        /* Utility classes for custom colors (use Tailwind classes where possible) */
        .bg-abyss-blue { background-color: var(--abyss-blue); }
        .text-abyss-blue { color: var(--abyss-blue); }
        .bg-golden-hive { background-color: var(--golden-hive); }
        .text-golden-hive { color: var(--golden-hive); }
        .border-golden-hive { border-color: var(--golden-hive); }
        .hover\:bg-golden-hive-dark:hover { background-color: #E0A800; } 
        
        .bg-light-nectar { background-color: var(--light-nectar); }
        .text-deep-slate { color: var(--deep-slate); }
        .text-white-honey { color: var(--white-honey); }
        .text-honeycomb-gray { color: var(--honeycomb-gray); }
        .text-pollen-dust { color: var(--pollen-dust); }
        .border-pollen-dust { border-color: var(--pollen-dust); }

        /* Hexagon styles */
        .hexagon {
            position: relative; width: 150px; height: 173.2px; 
            background-color: var(--deep-slate); margin: 20px auto; /* Tailwind: mx-auto my-5 */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; /* Tailwind: flex flex-col items-center justify-center */
            padding: 20px; box-sizing: border-box; text-align: center;
        }
        .hexagon-sm {
            width: 100px; height: 115.47px; background-color: rgba(255, 255, 255, 0.05); /* Tailwind: bg-white bg-opacity-5 */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            position: absolute; z-index: 0;
        }

        /* Icon placeholder styles */
        .icon-placeholder { 
            /* Tailwind: w-10 h-10 bg-golden-hive rounded-full flex items-center justify-center text-abyss-blue font-bold mb-2.5 */
            width: 40px; height: 40px; background-color: var(--golden-hive); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--abyss-blue); font-weight: bold; margin-bottom: 10px;
        }
        .icon-sm-placeholder { width: 24px; height: 24px; fill: var(--golden-hive); } /* For SVGs, fill can be text-golden-hive with currentSVG */

        /* Menu State CSS */
        #appContainer.menu-active #sideMenu {
            transform: translateX(0); /* Handles mobile menu visibility */
        }
    </style>
</head>
<body class="bg-abyss-blue text-light-nectar">
    <button id="menuToggleBtn" class="fixed top-4 left-4 z-50 p-2 rounded-md bg-deep-slate text-golden-hive hover:bg-golden-hive hover:text-abyss-blue md:hidden">
        ☰
    </button>

    <div id="appContainer" class="flex min-h-screen">
        <nav id="sideMenu" class="bg-deep-slate text-light-nectar w-64 p-5 h-screen fixed inset-y-0 left-0 transform -translate-x-full transition-transform duration-300 ease-in-out z-40 md:relative md:translate-x-0 md:block">
            <div class="text-center py-4 mb-4">
                <h1 class="text-2xl font-bold text-golden-hive" data-translate-key="app_title_short">ROI App</h1>
            </div>
            <a href="#" data-section="roi-calculator" class="menu-item block py-2.5 px-4 rounded hover:bg-golden-hive hover:text-abyss-blue text-pollen-dust" data-translate-key="menu_roiCalculator">Calculadora ROI</a>
            <a href="#" data-section="dashboard" class="menu-item block py-2.5 px-4 rounded hover:bg-golden-hive hover:text-abyss-blue text-pollen-dust" data-translate-key="menu_dashboard">Dashboard</a>
            <hr class="border-honeycomb-gray my-4">
            <button id="languageToggleBtn" class="menu-item block py-2.5 px-4 rounded bg-golden-hive text-abyss-blue hover:bg-bright-pollen w-full text-center" data-translate-key="language_toggle_button">Switch to English</button>
        </nav>

        <main id="contentArea" class="flex-1 p-6 md:p-10 transition-all duration-300 ease-in-out md:ml-64">
            
            <div id="welcomeMessage" class="main-section bg-deep-slate p-8 rounded-lg shadow-xl text-center">
                <div class="hexagon mb-6"> <!-- Tailwind: mx-auto my-5 (already in .hexagon CSS) -->
                    <div class="icon-placeholder">APP</div> <!-- Tailwind: see .icon-placeholder CSS comments -->
                    <p class="text-golden-hive text-sm font-semibold mt-1">ROI Master</p>
                </div>
                <h2 data-translate-key="welcome_title" class="text-3xl font-bold text-golden-hive mb-4">Bem-vindo ao ROI Marketing App!</h2>
                <p data-translate-key="welcome_message" class="text-lg text-light-nectar">Use o menu para navegar até a Calculadora de ROI ou o Dashboard.</p>
            </div>

            <section id="roi-calculator" class="main-section bg-deep-slate p-6 md:p-8 rounded-lg shadow-xl relative overflow-hidden" style="display:none;">
                <!-- Optional decorative hexagons -->
                <div class="hexagon-sm hidden md:block" style="top: -20px; left: -30px; opacity: 0.2; transform: rotate(15deg);"></div>
                <div class="hexagon-sm hidden md:block" style="bottom: -40px; right: -20px; opacity: 0.2; transform: rotate(-15deg);"></div>
                
                <div class="flex items-center mb-6">
                    <div class="icon-placeholder mr-3"><span class="text-xl">C</span></div>
                    <h2 data-translate-key="section_roiCalculator_title" class="text-2xl font-semibold text-golden-hive">ROI Calculator</h2>
                </div>
                <div class="space-y-6">
                    <div class="mb-4">
                        <label for="investmentAmount" data-translate-key="calculator_investmentAmountLabel" class="block text-sm font-medium text-honeycomb-gray mb-1">Investment Amount:</label>
                        <input type="number" id="investmentAmount" placeholder="e.g., 1000" data-translate-key="calculator_investmentAmountPlaceholder" class="w-full p-3 rounded-md bg-abyss-blue border border-honeycomb-gray text-light-nectar focus:border-golden-hive focus:ring-1 focus:ring-golden-hive placeholder-honeycomb-gray">
                    </div>
                    <div class="mb-4">
                        <label for="revenueGenerated" data-translate-key="calculator_revenueGeneratedLabel" class="block text-sm font-medium text-honeycomb-gray mb-1">Revenue Generated:</label>
                        <input type="number" id="revenueGenerated" placeholder="e.g., 1500" data-translate-key="calculator_revenueGeneratedPlaceholder" class="w-full p-3 rounded-md bg-abyss-blue border border-honeycomb-gray text-light-nectar focus:border-golden-hive focus:ring-1 focus:ring-golden-hive placeholder-honeycomb-gray">
                    </div>
                </div>
                <button id="calculateRoiBtn" data-translate-key="calculator_calculateButton" class="mt-8 w-full py-3 px-4 rounded-md bg-golden-hive text-abyss-blue font-semibold hover:bg-bright-pollen focus:outline-none focus:ring-2 focus:ring-bright-pollen focus:ring-opacity-50 transition-colors">Calculate ROI</button>
                <div id="roiResult" class="mt-6 p-4 rounded-md bg-abyss-blue border border-golden-hive text-lg text-light-nectar">
                </div>
            </section>

            <section id="dashboard" class="main-section bg-deep-slate p-6 md:p-8 rounded-lg shadow-xl relative overflow-hidden" style="display:none;">
                <!-- Optional decorative hexagons -->
                <div class="hexagon-sm hidden md:block" style="top: 5%; right: 5%; opacity: 0.2; transform: rotate(-30deg);"></div>
                <div class="hexagon-sm hidden md:block" style="bottom: 10%; left: 5%; opacity: 0.2; transform: rotate(45deg);"></div>

                <div class="flex items-center mb-6">
                    <div class="icon-placeholder mr-3"><span class="text-xl">D</span></div>
                    <h2 data-translate-key="section_dashboard_title" class="text-2xl font-semibold text-golden-hive">Dashboard</h2>
                </div>
                
                <div id="summaryMetrics" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-abyss-blue p-6 rounded-lg shadow-lg text-center md:text-left">
                        <span data-translate-key="dashboard_totalInvestmentLabel" class="block text-sm text-honeycomb-gray uppercase tracking-wider">Total Investment:</span>
                        <span id="totalInvestment" class="block text-3xl font-bold text-golden-hive mt-1">0.00</span>
                    </div>
                    <div class="bg-abyss-blue p-6 rounded-lg shadow-lg text-center md:text-left">
                        <span data-translate-key="dashboard_totalRevenueLabel" class="block text-sm text-honeycomb-gray uppercase tracking-wider">Total Revenue:</span>
                        <span id="totalRevenue" class="block text-3xl font-bold text-golden-hive mt-1">0.00</span>
                    </div>
                    <div class="bg-abyss-blue p-6 rounded-lg shadow-lg text-center md:text-left">
                        <span data-translate-key="dashboard_overallRoiLabel" class="block text-sm text-honeycomb-gray uppercase tracking-wider">Overall ROI:</span>
                        <span id="overallRoi" class="block text-3xl font-bold text-golden-hive mt-1">0.00%</span>
                    </div>
                </div>

                <div id="calculationHistory">
                    <h3 data-translate-key="dashboard_historyTitle" class="text-xl font-semibold text-golden-hive mb-4">Calculation History</h3>
                    <div class="overflow-x-auto bg-abyss-blue rounded-lg shadow-lg">
                        <table id="historyTable" class="w-full">
                            <thead class="bg-deep-slate">
                                <tr>
                                    <th data-translate-key="dashboard_historyTableHeadInvestment" class="p-3 text-left text-xs font-medium text-golden-hive uppercase tracking-wider">Investment</th>
                                    <th data-translate-key="dashboard_historyTableHeadRevenue" class="p-3 text-left text-xs font-medium text-golden-hive uppercase tracking-wider">Revenue</th>
                                    <th data-translate-key="dashboard_historyTableHeadRoi" class="p-3 text-left text-xs font-medium text-golden-hive uppercase tracking-wider">ROI (%)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-honeycomb-gray">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="locales.js"></script>
    <script src="app.js"></script>
</body>
</html>
